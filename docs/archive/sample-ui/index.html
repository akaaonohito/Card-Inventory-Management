<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カード在庫管理 サンプルUI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>カード在庫管理</h1>
      <p>本実装前の使用感確認用サンプル</p>
    </div>
    <div class="header-actions">
      <button class="secondary" id="exportCsvButton">CSVエクスポート</button>
    </div>
  </header>

  <nav class="tabs" aria-label="画面切り替え">
    <button class="tab active" data-view="inventory">在庫一覧</button>
    <button class="tab" data-view="add">商品追加</button>
    <button class="tab" data-view="csv">CSV</button>
    <button class="tab" data-view="settings">設定</button>
  </nav>

  <main>
    <section class="view active" id="view-inventory">
      <section class="toolbar">
        <div class="summary-grid">
          <div class="metric">
            <span>販売中</span>
            <strong id="metricOnSale">0</strong>
          </div>
          <div class="metric">
            <span>90日以上未確認</span>
            <strong id="metricStale">0</strong>
          </div>
          <div class="metric">
            <span>表示中</span>
            <strong id="metricVisible">0</strong>
          </div>
          <div class="metric">
            <span>選択中</span>
            <strong id="metricSelected">0</strong>
          </div>
        </div>

        <div class="filter-toggle-row">
          <button class="secondary" id="toggleFiltersButton" type="button" aria-expanded="false" aria-controls="filterPanel">絞り込みを開く</button>
          <span class="filter-summary" id="filterSummary">販売中のみ表示中</span>
        </div>

        <div class="filter-panel" id="filterPanel" hidden>
          <form class="filters" id="filterForm">
            <label>
              ジャンル
              <select name="genre">
                <option value="">すべて</option>
                <option>MTG</option>
                <option>ポケカ</option>
                <option>遊戯王</option>
                <option>デュエマ</option>
                <option>ワンピースカード</option>
              </select>
            </label>
            <label>
              カード名
              <input name="cardName" type="search" placeholder="部分一致">
            </label>
            <label>
              セット
              <input name="setName" type="search" placeholder="例: 4EDBB">
            </label>
            <label>
              コレクター番号
              <input name="collectorNumber" type="search" placeholder="例: 055/071">
            </label>
            <label>
              ステータス
              <select name="status">
                <option value="販売中">販売中</option>
                <option value="">すべて</option>
                <option>売却済み</option>
                <option>取置中</option>
                <option>販売停止</option>
                <option>削除済み</option>
              </select>
            </label>
            <label>
              補足
              <input name="note" type="search" placeholder="Foil、プロモなど">
            </label>
            <label>
              価格見直し
              <select name="reviewDays">
                <option value="">指定なし</option>
                <option value="30">30日以上未確認</option>
                <option value="90">90日以上未確認</option>
                <option value="180">180日以上未確認</option>
              </select>
            </label>
            <label>
              ソート
              <span class="range-inputs">
                <select name="sortKey">
                  <option value="lastCheckedAt">最終確認日</option>
                  <option value="genre">ジャンル</option>
                  <option value="cardName">カード名</option>
                  <option value="quantity">枚数</option>
                  <option value="salePrice">販売価格</option>
                  <option value="status">在庫ステータス</option>
                </select>
                <select name="sortDir">
                  <option value="asc">昇順</option>
                  <option value="desc">降順</option>
                </select>
              </span>
            </label>
            <div class="form-actions">
              <button class="primary" type="submit">絞り込み</button>
              <button class="secondary" type="button" id="clearFiltersButton">解除</button>
            </div>
          </form>
        </div>
      </section>

      <section class="table-shell">
        <div class="table-top">
          <h2>在庫一覧</h2>
          <div>
            <button class="secondary" id="markCheckedButton">確認日を今日にする</button>
            <button class="secondary" id="soldSelectedButton">売却済みにする</button>
            <button class="danger" id="deleteSelectedButton">削除済みにする</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><input id="selectAll" type="checkbox" aria-label="全件選択"></th>
                <th>ジャンル</th>
                <th>カード名</th>
                <th>補足</th>
                <th>枚数</th>
                <th>販売価格</th>
                <th>最終確認日</th>
                <th>ステータス</th>
                <th>価格検索</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
        <div class="pagination" aria-label="ページ切り替え">
          <button class="secondary" id="prevPageButton" type="button">前へ</button>
          <span id="pageInfo">1 / 1ページ</span>
          <button class="secondary" id="nextPageButton" type="button">次へ</button>
        </div>
      </section>
    </section>

    <section class="view" id="view-add">
      <section class="panel">
        <h2>商品追加</h2>
        <form class="edit-form" id="addForm">
          <label>ジャンル<select name="genre" required><option>MTG</option><option>ポケカ</option><option>遊戯王</option><option>デュエマ</option><option>ワンピースカード</option><option>その他</option></select></label>
          <label>カード名<input name="cardName" required placeholder="例: Lightning Bolt"></label>
          <label>レア<input name="rarity" placeholder="例: C"></label>
          <label>セット<input name="setName" placeholder="例: 4EDBB"></label>
          <label>言語<input name="language" placeholder="jp"></label>
          <label>コレクター番号<input name="collectorNumber" placeholder="055/071"></label>
          <label>補足<input name="note" placeholder="Foil、プロモなど"></label>
          <label>カード状態<input name="condition" placeholder="A、MPなど"></label>
          <label>枚数<input name="quantity" type="number" min="1" required value="1"></label>
          <label>買取価格<input name="buyPrice" inputmode="numeric" pattern="[0-9]*" value="0"></label>
          <label>販売価格<input name="salePrice" inputmode="numeric" pattern="[0-9]*" required></label>
          <label>最終確認日<input name="lastCheckedAt" type="date"></label>
          <label>在庫ステータス<select name="status"><option>販売中</option><option>取置中</option><option>販売停止</option></select></label>
          <label class="wide">メモ<textarea name="memo" rows="3"></textarea></label>
          <div class="form-actions wide">
            <button class="primary" type="submit">ダミー在庫に追加</button>
            <button class="secondary" type="reset">クリア</button>
          </div>
        </form>
      </section>
    </section>

    <section class="view" id="view-csv">
      <section class="panel two-column">
        <div>
          <h2>CSVインポート</h2>
          <p class="muted">ここでは本物のファイル読込ではなく、インポート前確認の流れを再現しています。</p>
          <textarea id="csvPreview" rows="10">在庫ID,ジャンル,カード名,レア,セット,言語,コレクター番号,補足,カード状態,枚数,買取価格,販売価格,在庫ステータス,登録日,最終確認日,更新日,メモ
,MTG,Counterspell,U,DMR,en,,通常,MP,2,150,480,販売中,2026/03/05,2026/03/05,2026/03/05,
,ポケカ,ピカチュウ,SAR,SV8a,jp,236/187,テラスタル,A,1,4200,5980,販売中,03/12,03/12,03/12,ショーケース候補</textarea>
          <div class="form-actions">
            <button class="primary" id="validateCsvButton">エラー確認</button>
            <button class="secondary" id="importCsvButton">エラー行を除いて取り込み</button>
          </div>
        </div>
        <div class="preview-box">
          <h3>確認結果</h3>
          <ul id="csvErrors">
            <li>未確認です。エラー確認を押してください。</li>
          </ul>
        </div>
      </section>
    </section>

    <section class="view" id="view-settings">
      <section class="panel">
        <h2>設定</h2>
        <div class="settings-grid">
          <div>
            <div class="section-heading">
              <h3>価格検索リンク</h3>
              <div>
                <button class="secondary" type="button">テンプレート編集</button>
                <button class="primary" type="button">検索ジャンル追加</button>
              </div>
            </div>
            <table class="settings-table">
              <thead><tr><th>有効</th><th>ジャンル</th><th>サイト名</th><th>検索URLテンプレート</th></tr></thead>
              <tbody id="linkSettingsBody"></tbody>
            </table>
          </div>
          <div>
            <h3>表示列</h3>
            <div class="column-list" id="columnSettings"></div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="detail-overlay" id="detailOverlay" hidden>
    <aside class="detail-panel" aria-label="詳細編集">
      <form id="detailForm">
        <div class="detail-header">
          <div>
            <h2>詳細編集</h2>
            <p id="detailMeta"></p>
          </div>
          <button class="secondary" type="button" id="closeDetailButton">閉じる</button>
        </div>
        <div class="edit-form" id="detailFields"></div>
        <div class="form-actions detail-actions">
          <button class="primary" type="submit">保存</button>
          <button class="secondary" type="button" id="cancelDetailButton">キャンセル</button>
        </div>
      </form>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
